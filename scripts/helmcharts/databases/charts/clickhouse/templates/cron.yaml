# https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
{{- $kubeTargetVersion := .Capabilities.KubeVersion.GitVersion }}
{{- if semverCompare ">=1.22.0-0" $kubeTargetVersion }}
apiVersion: batch/v1
{{- else }}
apiVersion: batch/v1beta1
{{- end }}
kind: CronJob
metadata:
  name: clickhouse-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backupCronJob.schedule | quote }}
  {{- if .Values.backupCronJob.timeZone }}
  timeZone: {{ .Values.backupCronJob.timeZone | quote }}
  {{- end }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0 # Don't restart the failed jobs
      template:
        spec:
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
          - name: clickhouse-backup
            image: alpine/curl:8.17.0
            command:
              - /bin/sh
              - -c
            args:
              - |
                set -eu
                BACKUP_NAME=openreplay_clickhouse_backup$(date -u +%Y-%m-%dT%H-%M-%S)
                {{ if .Values.backupCronJob.remote }}
                OPERATION=create_remote
                {{ else }}
                OPERATION=create
                {{ end }}
                curl -fsS -XPOST "http://clickhouse-openreplay-clickhouse:7171/backup/$OPERATION?name=$BACKUP_NAME"
                ATTEMPT=0
                while [ "$ATTEMPT" -lt 120 ]; do
                  sleep 15
                  STATUS=$(curl -fsS "http://clickhouse-openreplay-clickhouse:7171/backup/status?name=$BACKUP_NAME")
                  case "$STATUS" in
                    *'"status":"success"'*) echo "$STATUS"; exit 0 ;;
                    *'"status":"error"'*) echo "$STATUS"; exit 1 ;;
                  esac
                  ATTEMPT=$((ATTEMPT + 1))
                done
                echo "ClickHouse backup timed out: $BACKUP_NAME" >&2
                exit 1
          restartPolicy: Never
