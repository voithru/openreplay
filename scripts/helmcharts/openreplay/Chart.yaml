apiVersion: v2
name: openreplay
description: A Helm chart for Kubernetes

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
# Ref: https://github.com/helm/helm/issues/7858#issuecomment-608114589
AppVersion: "v1.27.0"

dependencies:
  - name: alerts
    version: 0.1.1
    repository: "file://charts/alerts"
    condition: alerts.enabled
  - name: api
    version: 0.1.1
    repository: "file://charts/api"
    condition: api.enabled
  - name: assets
    version: 0.1.1
    repository: "file://charts/assets"
    condition: assets.enabled
  - name: assist
    version: 0.1.1
    repository: "file://charts/assist"
    condition: assist.enabled
  - name: assist-stats
    version: 0.1.7
    repository: "file://charts/assist-stats"
    condition: global.ee-components.enabled
  - name: canvases
    version: 0.1.1
    repository: "file://charts/canvases"
    condition: canvases.enabled
  - name: chalice
    version: 0.1.7
    repository: "file://charts/chalice"
    condition: chalice.enabled
  - name: db
    version: 0.1.1
    repository: "file://charts/db"
    condition: db.enabled
  - name: ender
    version: 0.1.1
    repository: "file://charts/ender"
    condition: ender.enabled
  - name: frontend
    version: 0.1.10
    repository: "file://charts/frontend"
    condition: frontend.enabled
  - name: heuristics
    version: 0.1.1
    repository: "file://charts/heuristics"
    condition: heuristics.enabled
  - name: http
    version: 0.1.1
    repository: "file://charts/http"
    condition: http.enabled
  - name: images
    version: 0.1.1
    repository: "file://charts/images"
    condition: images.enabled
  - name: integrations
    version: 0.1.1
    repository: "file://charts/integrations"
    condition: integrations.enabled
  - name: sink
    version: 0.1.1
    repository: "file://charts/sink"
    condition: sink.enabled
  - name: sourcemapreader
    version: 0.1.1
    repository: "file://charts/sourcemapreader"
    condition: sourcemapreader.enabled
  - name: spot
    version: 0.1.1
    repository: "file://charts/spot"
    condition: spot.enabled
  - name: storage
    version: 0.1.1
    repository: "file://charts/storage"
    condition: storage.enabled
  - name: utilities
    version: 0.1.0
    repository: "file://charts/utilities"
    condition: utilities.enabled
  - name: ingress-nginx
    version: 2.4.1
    repository: "file://charts/ingress-nginx"
    condition: ingress-nginx.enabled
  - name: connector
    repository: file://charts/connector
    version: 0.1.1
    condition: connector.enabled
  - name: assist-api
    repository: file://charts/assist-api
    version: 0.1.1
    condition: global.ee-components.enabled
